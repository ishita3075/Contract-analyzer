server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: contract-analysis
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cip_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000} # 24 hours
    refresh-token-expiration: 604800000    # 7 days

llm:
  mock: ${LLM_MOCK:false}                             # Set to false to use real AI
  provider: ${LLM_PROVIDER:ollama}                  # choices: ollama, groq
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ambuj-indian-legal-llama
    timeout-seconds: 300
    max-tokens: 4096
    temperature: 0.1
  groq:
    base-url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.3-70b-versatile
    api-key: ${APP_GROQ_API_KEY:NOT_SET}
    timeout-seconds: 60
